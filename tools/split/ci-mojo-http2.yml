name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: latest
          cache: true

      - name: Fetch source dependencies (mojo-net)
        env:
          MOJO_NET_DEPLOY_KEY: ${{ secrets.MOJO_NET_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$MOJO_NET_DEPLOY_KEY" > ~/.ssh/dep_mojo-net
          chmod 600 ~/.ssh/dep_mojo-net
          printf "Host github.com-mojo-net\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/dep_mojo-net\n" >> ~/.ssh/config
          GIT_URL_TEMPLATE="git@github.com-{name}:nsalerni/{name}.git" python3 tools/fetch_deps.py

      - name: Install h2spec
        run: |
          curl -sL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
          sudo mv h2spec /usr/local/bin/

      - name: Docstring coverage (mojo doc gate)
        run: |
          total=0
          for f in src/hpack/*.mojo src/h2/*.mojo; do
            n=$(pixi run mojo doc --diagnose-missing-doc-strings -o /dev/null "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit tests
        run: pixi run test

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Compatibility suite (python-hpack, hyperframe, hyper-h2, h2spec)
        run: pixi run compliance

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ matrix.os }}
          path: COMPLIANCE.md
