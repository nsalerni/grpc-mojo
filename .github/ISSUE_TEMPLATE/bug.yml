name: Bug
description: Something is broken or disagrees with a reference implementation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, a short program, or a failing compliance seed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag or commit, plus OS and architecture.
    validations:
      required: true
