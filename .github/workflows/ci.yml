name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grpc-framing-compatibility:
    name: gRPC framing compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Run deterministic gRPC framing checks
        run: pixi run grpc-framing-compatibility-smoke

      - name: Upload the first gRPC framing mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grpc-framing-mismatch
          path: build/grpc-framing-mismatch.json
          if-no-files-found: ignore

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          post-cleanup: true

      - name: Fetch source dependencies (mojo-net, protomojo, mojo-http2, mojo-tls)
        run: python3 tools/fetch_deps.py

      - name: Install h2spec
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if brew untrust --tap | grep -Fxq "  aws/tap"; then
              brew untap aws/tap
            fi
            brew install h2spec
          else
            curl -sL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
            sudo mv h2spec /usr/local/bin/
          fi

      - name: Docstring coverage (mojo doc gate)
        run: |
          total=0
          for f in src/grpc/*.mojo; do
            n=$(pixi run mojo doc --diagnose-missing-doc-strings -o /dev/null \
              -I packages/mojo-net/src -I packages/mojo-http2/src \
              -I packages/mojo-tls/src -I packages/protomojo/src -I src \
              "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit suites (spec vectors + reference goldens)
        run: pixi run test

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Official gRPC interop cases (both directions vs grpcio)
        run: pixi run interop-official

      - name: Verify published interop results are current
        run: |
          git diff --exit-code -- docs/official-interop-results.json
          git diff --exit-code -- docs/official-interop-badge.json

      - name: Compliance suite (differential vs reference implementations)
        run: pixi run compliance

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-report-${{ matrix.os }}
          path: |
            docs/COMPLIANCE.md
            docs/COMPLIANCE.html
            docs/official-interop-results.json
            docs/official-interop-badge.json

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Build and test the installed package
        run: python3 packaging/test_installed_package.py
