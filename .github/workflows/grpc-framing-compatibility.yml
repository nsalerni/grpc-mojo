name: gRPC framing compatibility

on:
  schedule:
    - cron: "17 10 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grpc-framing-compatibility:
    name: 10,000 framing cases
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Run 10,000 gRPC framing cases
        run: |
          pixi run grpc-framing-compatibility \
            --seed 20260825 \
            --case-count 10000 \
            --failure-artifact grpc-framing-compatibility-mismatch.json

      - name: Upload the first gRPC framing mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grpc-framing-compatibility-mismatch
          path: grpc-framing-compatibility-mismatch.json
          if-no-files-found: ignore
          retention-days: 14
