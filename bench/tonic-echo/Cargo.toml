[package]
name = "tonic-echo-bench"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"

[dependencies]
futures = "0.3"
prost = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"
